<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow Pro - เข้าสู่ระบบ</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="split-auth-container">
    <!-- ฝั่งซ้าย: ฟอร์มเข้าสู่ระบบ -->
    <div class="auth-form-side">
      <div style="position: absolute; top: 24px; left: 24px;">
        <span style="font-weight: 700; font-size: 20px; color: var(--primary); display: flex; align-items: center; gap: 8px;">
          <i class="fas fa-layer-group"></i> TaskFlow Pro
        </span>
      </div>

      <div style="position: absolute; top: 24px; right: 24px;">
        <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()"><i class="fas fa-moon"></i></button>
      </div>

      <div class="auth-form-container">
        <div class="auth-header" style="text-align: left; margin-bottom: 24px;">
          <p style="color: var(--text-muted); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;">Start your journey</p>
          <h2 style="font-size: 32px; font-weight: 700; color: var(--text-main);">Sign In to TaskFlow</h2>
        </div>
        
        <form id="loginForm">
          <div class="form-group">
            <label>ชื่อผู้ใช้งาน (Username)</label>
            <div class="input-icon-wrap">
              <i class="fas fa-user"></i>
              <input type="text" id="loginUsername" class="form-control" required placeholder="กรอก Username ของคุณ">
            </div>
          </div>
          
          <div class="form-group">
            <label>รหัสผ่าน (Password)</label>
            <div class="input-icon-wrap">
              <i class="fas fa-lock"></i>
              <input type="password" id="loginPassword" class="form-control" required placeholder="กรอกรหัสผ่าน">
            </div>
          </div>

          <button type="submit" class="btn-primary-custom">Sign In</button>
        </form>

        <div class="auth-footer-link" style="text-align: left; margin-top: 24px;">
          <p>Don't have an account? <a href="register.html" style="color: var(--primary); font-weight: 600;">Sign up</a></p>
        </div>
      </div>
    </div>

    <!-- ฝั่งขวา: แผงรูปภาพและแอนิเมชัน -->
    <div class="auth-visual-side">
      <div class="visual-content">
        <h3 style="font-size: 28px; margin-bottom: 12px; font-weight: 700;">Manage Your Projects Efficiently</h3>
        <p style="font-size: 14px; opacity: 0.9; line-height: 1.5;">ระบบจัดการงานและโครงงานนักศึกษาอัจฉริยะ พร้อมระบบติดตามสถานะแบบเรียลไทม์</p>
      </div>
    </div>
  </div>

  <script src="script.io.js"></script>
</body>
</html>
