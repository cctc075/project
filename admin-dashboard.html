<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow Pro - แดชบอร์ดผู้ดูแลระบบ</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="toggleSidebar()"></div>

  <div class="app-container">
    <aside id="sidebar">
      <div class="sidebar-brand"><i class="fas fa-shield-alt"></i> TaskFlow Admin</div>
      <ul class="sidebar-menu">
        <li><a href="admin-dashboard.html" class="active"><i class="fas fa-users-cog"></i> จัดการผู้ใช้งาน</a></li>
        <li><a href="#" onclick="logout()"><i class="fas fa-sign-out-alt"></i> ออกจากระบบ</a></li>
      </ul>
    </aside>

    <div class="main-content">
      <header>
        <div class="topbar-left">
          <button class="hamburger" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
          <h2>ระบบผู้ดูแลระบบ (Admin)</h2>
        </div>
        <div style="display: flex; align-items: center; gap: 16px;">
          <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()"><i class="fas fa-moon"></i></button>
          <div class="user-profile-badge">
            <i class="fas fa-user-shield" style="font-size: 28px; color: var(--primary);"></i>
            <span id="userProfileName">Admin</span>
          </div>
        </div>
      </header>

      <div class="content-body">
        <h3 style="font-size: 20px; margin-bottom: 8px;">รายชื่อสมาชิกทั้งหมดในระบบ</h3>
        <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 20px;">ข้อมูลผู้ใช้ที่สมัครผ่านหน้า Register จะแสดงผลที่นี่แบบเรียลไทม์</p>
        
        <div class="table-responsive">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>ชื่อ-นามสกุล</th>
                <th>Username</th>
                <th>สิทธิ์การใช้งาน</th>
              </tr>
            </thead>
            <tbody id="adminUserTable">
              <!-- โหลดข้อมูลผ่าน JavaScript -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="script.io.js"></script>
</body>
</html>
