<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow Pro - สมัครสมาชิก</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="split-auth-container">
    <!-- ฝั่งซ้าย: แผงรูปภาพ (สลับตำแหน่งกับหน้า Login เพื่อสร้างเอฟเฟกต์แอนิเมชันสลับฝั่ง) -->
    <div class="auth-visual-side">
      <div class="visual-content">
        <h3 style="font-size: 28px; margin-bottom: 12px; font-weight: 700;">Join Our Community</h3>
        <p style="font-size: 14px; opacity: 0.9; line-height: 1.5;">เริ่มต้นสร้างอนาคตและจัดการโครงงานของคุณให้เป็นระบบไปกับ TaskFlow Pro</p>
      </div>
    </div>

    <!-- ฝั่งขวา: ฟอร์มสมัครสมาชิก -->
    <div class="auth-form-side">
      <div style="position: absolute; top: 24px; right: 24px;">
        <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()"><i class="fas fa-moon"></i></button>
      </div>

      <div class="auth-form-container">
        <div class="auth-header" style="text-align: left; margin-bottom: 24px;">
          <p style="color: var(--text-muted); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;">Start your journey</p>
          <h2 style="font-size: 32px; font-weight: 700; color: var(--text-main);">Sign Up to TaskFlow</h2>
        </div>
        
        <form id="registerForm">
          <div style="display: flex; gap: 12px;">
            <div class="form-group" style="flex: 1;">
              <label>ชื่อจริง</label>
              <div class="input-icon-wrap">
                <i class="fas fa-id-card"></i>
                <input type="text" id="regFname" class="form-control" required placeholder="ชื่อจริง">
              </div>
            </div>
            <div class="form-group" style="flex: 1;">
              <label>นามสกุล</label>
              <div class="input-icon-wrap">
                <i class="fas fa-id-card"></i>
                <input type="text" id="regLname" class="form-control" required placeholder="นามสกุล">
              </div>
            </div>
          </div>

          <div class="form-group">
            <label>Username</label>
            <div class="input-icon-wrap">
              <i class="fas fa-user"></i>
              <input type="text" id="regUsername" class="form-control" required placeholder="กำหนด Username">
            </div>
          </div>

          <div class="form-group">
            <label>Password</label>
            <div class="input-icon-wrap">
              <i class="fas fa-lock"></i>
              <input type="password" id="regPassword" class="form-control" required placeholder="กำหนดรหัสผ่าน">
            </div>
          </div>

          <button type="submit" class="btn-primary-custom">Sign Up</button>
        </form>

        <div class="auth-footer-link" style="text-align: left; margin-top: 24px;">
          <p>Already have an account? <a href="index.html" style="color: var(--primary); font-weight: 600;">Sign in</a></p>
        </div>
      </div>
    </div>
  </div>

  <script src="script.io.js"></script>
</body>
</html>
