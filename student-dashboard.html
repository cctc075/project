<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow Pro - แดชบอร์ดนักศึกษา</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="toggleSidebar()"></div>

  <div class="app-container">
    <aside id="sidebar">
      <div class="sidebar-brand"><i class="fas fa-layer-group"></i> TaskFlow Pro</div>
      <ul class="sidebar-menu">
        <li><a href="student-dashboard.html" class="active"><i class="fas fa-columns"></i> บอร์ดจัดการงาน</a></li>
        <li><a href="#" onclick="logout()"><i class="fas fa-sign-out-alt"></i> ออกจากระบบ</a></li>
      </ul>
    </aside>

    <div class="main-content">
      <header>
        <div class="topbar-left">
          <button class="hamburger" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
          <h2>แดชบอร์ดโครงงาน</h2>
        </div>
        <div style="display: flex; align-items: center; gap: 16px;">
          <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()"><i class="fas fa-moon"></i></button>
          <div class="user-profile-badge">
            <i class="fas fa-user-circle" style="font-size: 28px; color: var(--primary);"></i>
            <span id="userProfileName">ผู้ใช้งาน</span>
          </div>
        </div>
      </header>

      <div class="content-body">
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-info">
              <h3>งานทั้งหมด</h3>
              <div class="value" id="statTotal">0</div>
            </div>
            <div class="stat-icon" style="background: #e0e7ff; color: #4f46e5;"><i class="fas fa-tasks"></i></div>
          </div>
          <div class="stat-card">
            <div class="stat-info">
              <h3>รอดำเนินการ</h3>
              <div class="value" id="statTodo">0</div>
            </div>
            <div class="stat-icon" style="background: #fef3c7; color: #d97706;"><i class="fas fa-clock"></i></div>
          </div>
          <div class="stat-card">
            <div class="stat-info">
              <h3>กำลังดำเนินการ</h3>
              <div class="value" id="statDoing">0</div>
            </div>
            <div class="stat-icon" style="background: #e0e7ff; color: #6366f1;"><i class="fas fa-spinner"></i></div>
          </div>
          <div class="stat-card">
            <div class="stat-info">
              <h3>เสร็จสิ้น</h3>
              <div class="value" id="statDone">0</div>
            </div>
            <div class="stat-icon" style="background: #d1fae5; color: #059669;"><i class="fas fa-check-circle"></i></div>
          </div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
          <h3 style="font-size: 20px;">กระดานงาน (Kanban Board)</h3>
          <button class="btn-primary-custom" style="width: auto; padding: 12px 24px; margin: 0;" onclick="openTaskModal()"><i class="fas fa-plus"></i> เพิ่มงานใหม่</button>
        </div>

        <div class="kanban-container" id="kanbanBoard">
          <div class="kanban-col">
            <h4>รอดำเนินการ <span class="badge badge-todo">Todo</span></h4>
            <div class="kanban-dropzone" data-status="todo" id="colTodo" style="min-height: 400px;"></div>
          </div>
          <div class="kanban-col">
            <h4>กำลังดำเนินการ <span class="badge badge-doing">In Progress</span></h4>
            <div class="kanban-dropzone" data-status="doing" id="colDoing" style="min-height: 400px;"></div>
          </div>
          <div class="kanban-col">
            <h4>เสร็จสิ้น <span class="badge badge-done">Done</span></h4>
            <div class="kanban-dropzone" data-status="done" id="colDone" style="min-height: 400px;"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal" id="taskModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 style="font-size: 20px;">เพิ่มงานใหม่</h3>
        <button class="close-btn" onclick="closeTaskModal()">&times;</button>
      </div>
      <form id="taskForm" onsubmit="handleAddTask(event)">
        <div class="form-group">
          <label>ชื่องาน</label>
          <div style="display: flex; gap: 10px;">
            <input type="text" id="taskTitle" class="form-control" required placeholder="ระบุชื่องานโครงงาน" style="padding-left: 16px;">
            <button type="button" class="btn-primary-custom" style="width: 50px; margin:0;" onclick="startVoiceCommand()" title="สั่งงานด้วยเสียงภาษาไทย"><i class="fas fa-microphone"></i></button>
          </div>
        </div>
        <div class="form-group">
          <label>รายละเอียดเพิ่มเติม</label>
          <textarea id="taskDesc" class="form-control" rows="3" placeholder="รายละเอียดงาน..." style="padding-left: 16px;"></textarea>
        </div>
        <div class="form-group">
          <label>สถานะเริ่มต้น</label>
          <select id="taskStatus" class="form-control" style="padding-left: 16px;">
            <option value="todo">รอดำเนินการ</option>
            <option value="doing">กำลังดำเนินการ</option>
            <option value="done">เสร็จสิ้น</option>
          </select>
        </div>
        <button type="submit" class="btn-primary-custom">บันทึกข้อมูลงาน</button>
      </form>
    </div>
  </div>

  <script src="script.io.js"></script>
</body>
</html>
